[project]
# The distribution is boxline-sdk (the name boxline on PyPI is another project); the import name stays `boxline`.
name = "boxline-sdk"
version = "2.0.0"
description = "Python SDK for Boxline: cloud browsers and shell sandboxes for AI agents (sync and async)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Boxline" }]
keywords = ["boxline", "browser", "headless", "chrome", "playwright", "cdp", "sandbox", "ai-agents", "automation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "typing-extensions>=4.7"]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]
dev = ["pytest>=8", "pyyaml>=6"]

[project.urls]
Homepage = "https://boxline.dev"
Documentation = "https://docs.boxline.dev"
Source = "https://github.com/Boxline-dev/sdk-python"
Issues = "https://github.com/Boxline-dev/sdk-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxline"]

[tool.hatch.build.targets.sdist]
include = ["src/boxline", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
