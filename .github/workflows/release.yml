# Publishes boxline-sdk to PyPI when a release is published here on GitHub (tag v<version>), with PyPI's trusted
# publishing: no token, PyPI trusts this repository's workflow in the "pypi" environment.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must be the package's version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the release tag $GITHUB_REF_NAME is not v$version (pyproject.toml)"
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install -q -e ".[dev]"
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install -q build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
